# Local production-like stack: PostgreSQL + Re-Focus AI on http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refocus
      POSTGRES_PASSWORD: refocus
      POSTGRES_DB: refocus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refocus"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://refocus:refocus@db:5432/refocus
      FRONTEND_URL: http://localhost:8000
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:8000
volumes:
  pgdata:
