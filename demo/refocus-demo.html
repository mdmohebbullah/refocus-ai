<title>Re-Focus AI Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: app shell = header + sidebar + main, panels slide in from the right. Vintage sketchbook: cream paper, ink outlines, hand lettering. Solid = fact, dashed amber = AI. */
:root {
  --ink: #2B2A26; --muted: #5C5447; --line: #A8987A; --canvas: #F3EAD7; --surface: #FBF6EA;
  --navy: #2C4A6E; --on-navy: #FBF6EA;
  --fact: #2C4A6E; --fact-bg: #E2E7EC;
  --guess: #A4561A; --guess-bg: #F8E3C4;
  --ok: #3E6B47; --ok-bg: #DDE7D2;
  --danger: #9E2A1E; --danger-bg: #F6D6CC;
  --excl: #968C78; --shade: rgba(43,42,38,.35); --edge: #2B2A26;
  --mark: #F6D9A8;
  --font-ui: "Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  --font-doc: "Courier Prime", "Courier New", monospace;
  --font-hand: "Caveat", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #ECE2CC; --muted: #BEB29C; --line: #625A4C; --canvas: #1F1D1A; --surface: #2B2823;
  --navy: #D6B278; --on-navy: #1F1D1A; --fact: #A0BEDE; --fact-bg: #2C3642; --guess: #ECA864; --guess-bg: #402C18;
  --ok: #96C896; --ok-bg: #223426; --danger: #F08C78; --danger-bg: #421E18; --excl: #827A6C; --shade: rgba(0,0,0,.55); --edge: #0E0D0B; --mark: #5A4420; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ink: #ECE2CC; --muted: #BEB29C; --line: #625A4C; --canvas: #1F1D1A; --surface: #2B2823;
  --navy: #D6B278; --on-navy: #1F1D1A; --fact: #A0BEDE; --fact-bg: #2C3642; --guess: #ECA864; --guess-bg: #402C18;
  --ok: #96C896; --ok-bg: #223426; --danger: #F08C78; --danger-bg: #421E18; --excl: #827A6C; --shade: rgba(0,0,0,.55); --edge: #0E0D0B; --mark: #5A4420; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 16px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(color-mix(in srgb, var(--line) 25%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fact); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* shell */
.app { display: flex; flex-direction: column; height: 100%; }
header.top { border-bottom-width: 2px !important; border-bottom-color: var(--edge) !important; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 10px; height: 60px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--navy); font-size: 30px; font-family: var(--font-hand); white-space: nowrap; background: none; border: 0; padding: 0 6px 0 0; }
.logo { width: 30px; height: 30px; border-radius: 9px 3px 8px 4px; border: 2px solid var(--edge); font-family: var(--font-hand); font-size: 22px; background: var(--navy); color: var(--on-navy); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.proj { height: 36px; min-width: 0; max-width: 240px; flex: 0 1 240px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 0 8px; font-size: 13.5px; }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.body { display: flex; flex: 1; min-height: 0; }
nav.side { width: 236px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 14px; text-align: left; }
.nav-item:hover { background: var(--canvas); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--fact-bg); color: var(--fact); font-weight: 600; }
main { flex: 1; min-width: 0; overflow-y: auto; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 22px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 700px) { .wrap { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); } }

/* demo guide */
.guide { border: 2px solid var(--edge); border-radius: 16px 6px 14px 7px / 7px 14px 6px 16px; box-shadow: 4px 4px 0 var(--edge); background: var(--surface); margin-bottom: 20px; overflow: hidden; }
.guide-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; }
.guide-tag { font-size: 13px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--on-navy); background: var(--navy); padding: 3px 8px; border-radius: 5px; }
.guide-now { flex: 1 1 260px; min-width: 0; font-size: 14px; }
.guide-now b { font-weight: 600; }
.guide-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; padding: 0 14px 12px; }
.step { text-align: left; border: 1.5px solid var(--line); border-radius: 10px 4px 9px 5px; background: var(--canvas); padding: 8px 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.step .n { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--excl); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.step.cur { border-color: var(--navy); color: var(--ink); background: var(--surface); }
.step.cur .n { border-color: var(--navy); color: var(--navy); }
.step.done .n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.step strong { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }

/* common */
h1 { font-family: var(--font-hand); font-size: 44px; font-weight: 700; line-height: 1; margin: 0 0 6px; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
h2 { font-family: var(--font-hand); font-size: 28px; font-weight: 700; line-height: 1; margin: 0; }
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 16px 6px 14px 7px / 7px 14px 6px 16px; padding: 18px; box-shadow: 4px 4px 0 var(--edge); }
.sec-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 10px 4px 9px 5px / 5px 9px 4px 10px; border: 2px solid var(--edge); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--fact); }
.btn.primary { background: var(--navy); border-color: var(--edge); color: var(--on-navy); box-shadow: 3px 3px 0 var(--edge); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--danger); }
.btn.sel { background: var(--fact-bg); border-color: var(--fact); color: var(--fact); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
label.fld { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
.inp, textarea.inp, select.inp { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 11px; font-size: 14px; }
textarea.inp { resize: vertical; min-height: 64px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; cursor: pointer; }
.chk input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--navy); flex: none; }
.chk.off { color: var(--muted); }

/* provenance */
.badge { display: inline-flex; align-items: center; gap: 4px; border: 1px solid; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge svg.i { width: 12px; height: 12px; }
.b-saved { color: var(--fact); background: var(--fact-bg); border-color: color-mix(in srgb, var(--fact) 35%, transparent); }
.b-rec { color: var(--muted); background: var(--canvas); border-color: var(--line); }
.b-guess, .b-sugg { color: var(--guess); background: var(--guess-bg); border-color: color-mix(in srgb, var(--guess) 45%, transparent); border-style: dashed; }
.b-conf { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.box { border: 2px solid; border-radius: 14px 5px 12px 6px / 6px 12px 5px 14px; padding: 13px 15px; }
.box-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.box-head .t { font-weight: 600; font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.x-saved { border-color: color-mix(in srgb, var(--fact) 50%, transparent); background: color-mix(in srgb, var(--fact-bg) 60%, var(--surface)); }
.x-rec { border-color: var(--line); background: var(--canvas); }
.x-guess { border-color: color-mix(in srgb, var(--guess) 60%, transparent); border-style: dashed; background: color-mix(in srgb, var(--guess-bg) 75%, var(--surface)); }
.x-conf { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok-bg) 70%, var(--surface)); }
.quote { font-family: var(--font-doc); font-style: italic; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.warn { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid color-mix(in srgb, var(--guess) 50%, transparent); background: var(--guess-bg); border-radius: 10px; padding: 11px 14px; font-size: 14px; }
.warn svg.i { color: var(--guess); margin-top: 2px; }

/* lists */
ul.plain { list-style: none; margin: 0; padding: 0; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.li .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li.excluded { color: var(--excl); }
.fav { width: 26px; height: 26px; border-radius: 6px; background: var(--canvas); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* editor */
.doc { background: var(--surface); border: 2px solid var(--edge); border-radius: 16px 6px 14px 7px / 7px 14px 6px 16px; box-shadow: 4px 4px 0 var(--edge); }
.doc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.doc-body { padding: 26px clamp(16px, 5vw, 56px) 40px; font-family: var(--font-doc); font-size: 17.5px; line-height: 1.75; outline: none; min-height: 320px; }
.doc-body h3 { font-family: var(--font-hand); font-size: 32px; margin: 0 0 12px; }
.doc-body p { margin: 0 0 1em; }
.doc-body p.mark { background: var(--mark); border-radius: 4px; box-shadow: -6px 0 0 var(--mark), 6px 0 0 var(--mark); animation: glow 2.4s ease-out; }
@keyframes glow { from { box-shadow: -6px 0 0 var(--mark), 6px 0 0 var(--mark), 0 0 0 6px color-mix(in srgb, var(--guess) 40%, transparent); } }
.saved-state { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: auto; }

/* resume card */
.timeline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.timeline button { background: none; border: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; padding: 4px 2px; }
.timeline button:not([disabled]):hover { color: var(--ink); }
.timeline button[disabled] { opacity: .45; cursor: default; }
.away { background: var(--canvas); border-radius: 9px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13.5px; }
.away .sim { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--muted); }
.chip.on { border-color: var(--navy); background: var(--navy); color: var(--on-navy); }
.hidden-guess { border: 1.5px dashed var(--line); border-radius: 10px; padding: 11px 14px; color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--shade); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 2px solid var(--edge); z-index: 41; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -12px 0 32px rgba(16,24,40,.12); animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); } }
.d-head { display: flex; align-items: center; gap: 4px; padding: 10px 10px 10px 8px; border-bottom: 1px solid var(--line); }
.d-head .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; padding-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); flex: none; }
.icon-btn:hover:not([disabled]) { background: var(--canvas); border-color: var(--line); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
header .menu-btn { display: none; }
.d-crumb { font-size: 11.5px; color: var(--muted); padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.d-body { flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.d-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.clue { display: flex; gap: 12px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; }
.clue:hover { border-color: var(--fact); }
.clue .k { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--on-navy); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.radio { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; }
.radio.on { border-color: var(--navy); background: var(--fact-bg); }
.radio input { margin-top: 3px; accent-color: var(--navy); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
.tbl tr.on td { background: var(--fact-bg); font-weight: 600; }

/* toast */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100% - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; box-shadow: 0 8px 24px rgba(16,24,40,.14); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.toast svg.i { color: var(--ok); }

/* responsive */
@media (max-width: 1023px) {
  nav.side { position: fixed; top: 0; left: 0; bottom: 0; z-index: 45; width: min(280px, 85%); transform: translateX(-102%); transition: transform .18s; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); }
  nav.side.open { transform: none; box-shadow: 12px 0 32px rgba(16,24,40,.18); }
  header .menu-btn { display: grid; }
}
@media (max-width: 640px) {
  .brand span.word { display: none; }
  .proj { flex: 1 1 auto; max-width: none; }
  .top .hide-sm { display: none; }
  .btn.pause span.long { display: none; }
  h1 { font-size: 21px; }
}
@media (min-width: 641px) { .btn.pause span.short { display: none; } }
</style>

<div class="app" id="app"></div>
<div id="drawer-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

function sug(c) {
  if (!S.sugg[c.id]) {

}

  return box(key === 'guess' ? 'guess' : 'sugg', title, esc(s.text) + `<div class="acts">

function pageHistory() {

  S.acts.filter(a => !a.excl && a.sel).forEach(a => ev.push({ at: minsAgo(a.m), k: 'Visited page', t: a.title, prov: 'rec' }));

  <div class="card"><ul class="plain">${ev.map(e => `<li class="li"><span class="num tiny muted" style="width:96px">${dayTime(e.at)}</span><div class="grow"><div class="ttl">${esc(e.t)}</div><div class="meta">${e.k}</div></div>${badge(e.prov)}</li>`).join('')}</ul></div>`;

/* ---------------------------------------------------------- panels */
function panelHtml(p) {
  const st = p.state;
  switch (p.type) {
    case 'pause': {
      const tabs = S.tabs.filter(t => !t.excl && !S.privateMode), acts = S.acts.filter(a => !a.excl && !S.privateMode);
      const pText = S.paras[S.paras.length - 1];
      return { title: 'Pause Session', body: `
        <p class="small muted" style="margin:0">Untick anything you don’t want kept. Unticked items are never given to the AI.</p>
        <label class="chk ${st.goalOn ? '' : 'off'}"><input type="checkbox" data-bind="goalOn" ${st.goalOn ? 'checked' : ''}><span><b>Goal</b> ${badge('saved')}<br>Compare how Study A and Study B measured user trust</span></label>
        <label class="chk ${st.posOn ? '' : 'off'}"><input type="checkbox" data-bind="posOn" ${st.posOn ? 'checked' : ''}><span><b>Exact writing position</b> ${badge('saved')}<br><span class="quote">“…${esc(pText)}”</span></span></label>
        <div><div class="small" style="font-weight:600;margin-bottom:2px">Open sources ${badge('rec')}</div>
          ${S.privateMode ? '<p class="small muted">Private mode is on — no browser data.</p>' : tabs.map(t => `<label class="chk ${st.tabs.includes(t.id) ? '' : 'off'}"><input type="checkbox" data-bind="tab" data-id="${t.id}" ${st.tabs.includes(t.id) ? 'checked' : ''}><span>${esc(t.title)}<br><span class="tiny muted">${esc(t.dom)}</span></span></label>`).join('')}
          ${S.privateMode ? '' : `<div class="tiny muted">${S.tabs.filter(t => t.excl).length} excluded tabs (banking, email) are hidden and never saved.</div>`}</div>
        <div><div class="small" style="font-weight:600;margin-bottom:2px">Last 60 minutes ${badge('rec')}</div>
          ${acts.slice(0, 4).map(a => `<label class="chk ${st.acts.includes(a.id) ? '' : 'off'}"><input type="checkbox" data-bind="act" data-id="${a.id}" ${st.acts.includes(a.id) ? 'checked' : ''}><span>${esc(a.title)} <span class="tiny muted">· ${clock(minsAgo(a.m))}</span></span></label>`).join('')}</div>
        <div style="border-top:1px solid var(--line);padding-top:12px" class="stack"><div style="font-weight:600">Unfinished thought <span class="tiny muted">(optional, in your words)</span></div>
          <div><label class="fld" for="p-think">What were you thinking?</label><textarea id="p-think" class="inp" data-bind="thinking" placeholder="e.g. Self-report and observed reliance may disagree.">${esc(st.thinking)}</textarea></div>
          <div><label class="fld" for="p-miss">What information is missing?</label><input id="p-miss" class="inp" data-bind="missing" value="${esc(st.missing)}" placeholder="e.g. A study that measured both."></div>
          <div><label class="fld" for="p-next">What were you planning to do next?</label><input id="p-next" class="inp" data-bind="next" value="${esc(st.next)}" placeholder="e.g. Explain why the two measures can diverge."></div>
          <div class="tiny muted">${ic('mic')} Voice input is available in the full app.</div></div>
        <div class="box x-guess"><div class="box-head"><div class="t">Question for your future self ${badge('sugg')}</div></div>
          <div style="margin-bottom:8px">When you come back, how will you finish the sentence “…differed in their measurement of user trust because”?</div>
          ${st.fsSkip ? `<div class="small muted">Skipped. <button class="btn sm ghost" data-bind-act="fs-unskip">Answer instead</button></div>` : `<label class="fld" for="p-fs">Your answer</label><input id="p-fs" class="inp" data-bind="fsA" value="${esc(st.fsA)}" placeholder="e.g. B is behavioural, A is a survey."><button class="btn sm ghost" style="margin-top:6px" data-bind-act="fs-skip">Skip question</button>`}</div>`,
        foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-cp">${ic('check')}Save checkpoint</button>` };
    }
    case 'thought': return { title: 'Save unfinished thought', body: `
        <p class="small muted" style="margin:0">Type the idea exactly as it is in your head. It is saved word for word and linked to the paragraph you are on.</p>
        <div><label class="fld" for="t-text">Your thought</label><textarea id="t-text" class="inp" data-bind="text" rows="4" placeholder="e.g. Maybe trust differs because Study B only counted accepted advice.">${esc(st.text)}</textarea></div>
        ${box('saved', 'Linked position', `<span class="quote">“…${esc(S.paras[S.paras.length - 1])}”</span>`)}`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-thought">${ic('check')}Save thought</button>` };
    case 'why': {
      const c = cp(), cl = clues(c), s = sug(c)[p.props.k];
      return { title: 'Why this ' + (p.props.k === 'guess' ? 'guess' : 'suggestion') + '?', body: `
        ${box(s.status === 'pending' ? (p.props.k === 'guess' ? 'guess' : 'sugg') : 'conf', '', esc(s.user || s.text))}
        <h2>Based on ${cl.length} clue${cl.length === 1 ? '' : 's'}</h2>
        ${cl.map((x, k) => `<button class="clue" data-act="open-clue" data-n="${k}"><span class="k">${k + 1}</span><span style="min-width:0"><span class="row" style="margin-bottom:3px"><b class="small">${esc(x.label)}</b>${badge(x.kind)}</span><span class="small" style="display:block">${esc(x.text)}</span><span class="tiny" style="color:var(--fact)">Open clue ${ic('right').replace('class="i"', 'class="i" style="width:12px;height:12px;vertical-align:-2px"')}</span></span></button>`).join('')}
        <div class="box x-rec"><div class="small"><b>Not used:</b> ${S.tabs.filter(t => t.excl).length} excluded tabs and any page you unticked. The AI only sees what you approved at pause.</div></div>`, foot: '' };
    }
    case 'source': {
      const x = p.props;
      return { title: x.title, body: `${box(x.prov || 'rec', x.title, `${esc(x.body)}${x.when ? `<div class="tiny muted" style="margin-top:6px">${x.prov === 'saved' ? 'Saved' : 'Recorded'} ${dayTime(x.when)}</div>` : ''}`)}
        ${x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${ic('ext')}Open page in a new tab</a><p class="tiny muted" style="margin:0">Sample address — the demo’s sources are not real pages.</p>` : ''}
        <p class="small muted" style="margin:0">Press <b>Back</b> (top left) to return to the previous panel.</p>`, foot: '' };
    }
    case 'help': return { title: 'Change help level', body: `
        ${[['brief', 'Brief', 'Your goal and where you stopped.'], ['balanced', 'Balanced', 'Adds your unfinished thought, sources, one AI guess and one next step.'], ['detailed', 'Detailed', 'Adds your note to your future self, time spent and more sources.']].map(([v, l, d]) => `<label class="radio ${st.level === v ? 'on' : ''}"><input type="radio" name="hl" data-bind="level" value="${v}" ${st.level === v ? 'checked' : ''}><span><b>${l}</b>${suggestFor(S.away)[1] === v ? ' <span class="pill" style="margin-left:4px">Suggested for your time away</span>' : ''}<br><span class="small muted">${d}</span></span></label>`).join('')}
        <label class="chk"><input type="checkbox" data-bind="remember" ${st.remember ? 'checked' : ''}><span class="small">Always use this level (otherwise it follows your time away)</span></label>`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="apply-help">Apply</button>` };
    case 'review': {
      const s = sug(cp())[p.props.k];
      return { title: 'Partly right?', body: `
        ${box(p.props.k === 'guess' ? 'guess' : 'sugg', 'AI version', esc(s.text))}
        <div><label class="fld" for="r-text">What is needed instead?</label><textarea id="r-text" class="inp" rows="4" data-bind="text" placeholder="Write the step the way you would do it.">${esc(st.text)}</textarea>
        <div class="tiny muted" style="margin-top:4px">Required. Your text replaces the AI’s and is labelled User Confirmed.</div></div>
        <p class="small muted" style="margin:0">Try it: type something, press <b>Back</b>, then <b>Forward</b>. Your text is still here.</p>`,
        foot: `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="use-step" ${st.text.trim() ? '' : 'disabled'}>${ic('check')}Use my step</button>` };
    }
  }
}

function renderDrawer() {
  const root = document.getElementById('drawer-root');
  const p = topPanel();
  if (!p) { root.innerHTML = ''; return; }
  const h = panelHtml(p);
  const names = S.stack.map(x => panelHtml(x).title);
  root.innerHTML = `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(h.title)}">
    <div class="d-head"><button class="icon-btn" data-act="back" ${S.idx <= 0 ? 'disabled' : ''} aria-label="Back to previous panel" title="Back">${ic('left')}</button>
      <button class="icon-btn" data-act="fwd" ${S.idx >= S.stack.length - 1 ? 'disabled' : ''} aria-label="Forward to next panel" title="Forward">${ic('right')}</button>
      <div class="t">${esc(h.title)}</div><button class="icon-btn" data-act="close" aria-label="Close panel">${ic('x')}</button></div>
    ${S.stack.length > 1 ? `<div class="d-crumb">${names.map((n, k) => k === S.idx ? `<b>${esc(n)}</b>` : esc(n)).join(' › ')}</div>` : ''}
    <div class="d-body" id="d-body">${h.body}</div>${h.foot ? `<div class="d-foot">${h.foot}</div>` : ''}</aside>`;
  const body = document.getElementById('d-body');
  if (p.scroll) body.scrollTop = p.scroll;
  body.addEventListener('scroll', () => { p.scroll = body.scrollTop; });
}

/* ---------------------------------------------------------- render */
function render() {
  const page = { dashboard: pageDashboard, editor: pageEditor, resume: pageResume, tabs: pageTabs, activity: pageActivity, checkpoints: pageCheckpoints,
    thoughts: pageThoughts, history: pageHistory, notes: pageNotes, assistant: pageAssistant, search: pageSearch, settings: pageSettings }[S.view];
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('app').innerHTML = `
  <header class="top">
    <button class="icon-btn menu-btn" data-act="menu" aria-label="Open menu">${ic('menu')}</button>
    <button class="brand" data-act="nav" data-v="dashboard" aria-label="Re-Focus AI home"><span class="logo">R</span><span class="word">Re-Focus AI</span></button>
    <label class="sr" for="proj">Current project</label><select id="proj" class="proj"><option>Literature review: trust in explainable AI</option></select>
    <div class="right">${S.privateMode ? `<span class="pill hide-sm">${ic('lock')}Private mode</span>` : ''}
      <button class="btn primary pause" data-act="open-pause" title="Pause Session (Alt+Shift+P)">${ic('pause')}<span class="long">Pause Session</span><span class="short">Pause</span></button>
      <button class="icon-btn" data-act="theme" aria-label="${dark ? 'Switch to light mode' : 'Switch to dark mode'}">${ic(dark ? 'sun' : 'moon')}</button></div>
  </header>
  <div class="body">
    <nav class="side ${S.navOpen ? 'open' : ''}" aria-label="Main">${NAV.map(([v, l, i]) => `<button class="nav-item" data-act="nav" data-v="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${ic(i)}${l}</button>`).join('')}
      <p class="tiny muted" style="margin:auto 8px 4px;padding-top:16px">Demo with sample data. Nothing you type leaves this page.</p></nav>
    ${S.navOpen ? '<div class="scrim" style="z-index:44" data-act="menu-close"></div>' : ''}
    <main><div class="wrap">${guideHtml()}${page()}</div></main>
  </div>`;
  if (S.view === 'editor' && S.mark !== false) placeCaret();
}

function placeCaret() {
  const el = document.querySelector(`#doc p[data-p="${S.mark}"]`);
  if (!el) return;
  el.scrollIntoView({ block: 'center' });
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  document.getElementById('doc').focus({ preventScroll: true });
}
function syncDoc() {
  const ps = [...document.querySelectorAll('#doc p')].map(p => p.textContent);
  if (ps.length) S.paras = ps;
}

/* ---------------------------------------------------------- actions */
const ACT = {
  nav: (d) => setView(d.v), menu: () => { S.navOpen = true; render(); }, 'menu-close': () => { S.navOpen = false; render(); },
  theme: () => { const r = document.documentElement; const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; render(); },
  reset: () => { S = freshState(); renderDrawer(); render(); toast('Demo reset.'); },
  'guide-go': (d) => { STEPS[+d.i].go(); },
  'open-pause': () => { if (S.view === 'editor') syncDoc(); openPanel('pause', {}, { goalOn: true, posOn: true, tabs: S.tabs.filter(t => t.sel && !t.excl).map(t => t.id), acts: S.acts.filter(a => a.sel && !a.excl).map(a => a.id), thinking: '', missing: '', next: '', fsA: '', fsSkip: false }); },
  'open-thought': () => { if (S.view === 'editor') syncDoc(); openPanel('thought', {}, { text: '' }); },
  'save-cp': () => {
    const st = topPanel().state;
    const para = S.paras.length - 1;
    const c = { id: Date.now(), at: new Date(), goal: 'Compare how Study A and Study B measured user trust', goalOn: st.goalOn, posOn: st.posOn, para, paraText: S.paras[para],
      sources: S.tabs.filter(t => st.tabs.includes(t.id)).map(t => ({ title: t.title, dom: t.dom })),
      acts: S.acts.filter(a => st.acts.includes(a.id)).map(a => ({ title: a.title, dom: a.dom })),
      thought: { thinking: st.thinking.trim(), missing: st.missing.trim(), next: st.next.trim() },
      fs: { q: 'How will you finish the sentence “…differed in their measurement of user trust because”?', a: st.fsSkip ? '' : st.fsA.trim() } };
    S.cps.push(c); S.cpIdx = S.cps.length - 1; S.away = 0;
    if (c.thought.thinking) S.thoughts.push({ id: Date.now(), text: c.thought.thinking, at: c.at, para, done: false });
    done('pause'); closePanels(); toast('Checkpoint saved. Take your break — your thinking is kept.');
  },
  'save-thought': () => {
    const t = topPanel().state.text.trim(); if (!t) { toast('Type your thought first.'); return; }
    S.thoughts.push({ id: Date.now(), text: t, at: new Date(), para: S.paras.length - 1, done: false });
    done('thought'); closePanels(); toast('Thought saved exactly as you wrote it.');
  },
  away: (d) => { S.away = +d.m; done('away'); render(); },
  'open-help': () => openPanel('help', {}, { level: level(), remember: !!S.helpPref }),
  'apply-help': () => { const st = topPanel().state; S.helpPref = st.level; if (!st.remember && st.level === suggestFor(S.away)[1]) S.helpPref = null; done('help'); closePanels(); toast(`Help level: ${st.level[0].toUpperCase() + st.level.slice(1)}.`); },
  'help-select': () => {},
  why: (d) => { openPanel('why', { k: d.k }); done('why_open'); },
  'open-clue': (d) => { const x = clues(cp())[+d.n]; openPanel('source', x.src); done('why'); },
  'open-source': (d) => openPanel('source', { title: d.t, body: 'Recorded while you worked · ' + d.d, url: 'https://' + d.d, prov: 'rec' }),
  accept: (d) => { const s = sug(cp())[d.k]; s.status = 'accepted'; render(); toast('Accepted — now labelled User Confirmed.'); },
  reject: (d) => { sug(cp())[d.k].status = 'rejected'; render(); toast('Rejected. This guess won’t be shown as information.'); },
  'undo-reject': (d) => { sug(cp())[d.k].status = 'pending'; render(); },
  partly: (d) => openPanel('review', { k: d.k }, { text: '' }),
  'use-step': () => { const p = topPanel(); const s = sug(cp())[p.props.k]; s.status = 'partly'; s.user = p.state.text.trim(); done('partly'); closePanels(); toast('Your step is saved and labelled User Confirmed.'); },
  back: () => { if (S.idx > 0) { S.idx--; renderDrawer(); } },
  fwd: () => { if (S.idx < S.stack.length - 1) { S.idx++; renderDrawer(); } },
  close: () => closePanels(),
  'cp-older': () => { if (S.cpIdx > 0) { S.cpIdx--; render(); } },
  'cp-newer': () => { if (S.cpIdx < S.cps.length - 1) { S.cpIdx++; render(); } },
  'open-cp': (d) => { S.cpIdx = S.cps.findIndex(c => c.id === +d.id); setView('resume'); },
  'resume-writing': () => { S.mark = cp().para; done('resume'); S.view = 'editor'; render(); toast('Back at the sentence where you stopped.'); },
  'goto-para': (d) => { S.mark = Math.min(+d.p, S.paras.length - 1); S.view = 'editor'; render(); },
  'thought-done': (d) => { const t = S.thoughts.find(x => x.id === +d.id); t.done = !t.done; render(); },
  'tabs-all': () => { S.tabs.forEach(t => { if (!t.excl) t.sel = true; }); render(); },
  'tabs-none': () => { S.tabs.forEach(t => { if (!t.excl) t.sel = false; }); render(); },
  'exclude-tab': (d) => { const t = S.tabs.find(x => x.id === +d.id); t.excl = 'Excluded by you'; t.sel = false; if (!S.excluded.includes(t.dom)) S.excluded.push(t.dom); S.acts.forEach(a => { if (a.dom === t.dom) a.excl = 'Excluded by you'; }); render(); toast(`${t.dom} excluded. Its titles and addresses are removed.`); },
  'act-window': (d) => { S.actWindow = +d.w; render(); },
  'search-ex': (d) => { S.searchQ = d.q; render(); },
  connect: () => { S.connected = true; render(); },
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  const ba = e.target.closest('[data-bind-act]');
  if (ba) { const st = topPanel().state; if (ba.dataset.bindAct === 'fs-skip') st.fsSkip = true; if (ba.dataset.bindAct === 'fs-unskip') st.fsSkip = false; renderDrawer(); return; }
  if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  if (b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.act === 'tab-toggle') { const x = S.tabs.find(v => v.id === +t.dataset.id); x.sel = t.checked; render(); }
  else if (t.dataset.act === 'act-toggle') { const x = S.acts.find(v => v.id === +t.dataset.id); x.sel = t.checked; render(); }
  else if (t.dataset.act === 'private') { S.privateMode = t.checked; render(); toast(t.checked ? 'Private mode on — nothing is collected.' : 'Private mode off.'); }
  else if (t.dataset.act === 'help-select') { S.helpPref = t.value === 'auto' ? null : t.value; render(); }
  else if (t.dataset.bind && topPanel()) {
    const st = topPanel().state, k = t.dataset.bind;
    if (k === 'tab' || k === 'act') { const arr = st[k + 's'], id = +t.dataset.id; t.checked ? arr.push(id) : arr.splice(arr.indexOf(id), 1); renderDrawer(); }
    else if (t.type === 'checkbox') { st[k] = t.checked; renderDrawer(); }
    else if (t.type === 'radio') { st[k] = t.value; renderDrawer(); }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind && topPanel() && t.type !== 'checkbox' && t.type !== 'radio') {
    topPanel().state[t.dataset.bind] = t.value;
    const use = document.querySelector('[data-act="use-step"]'); if (use) use.disabled = !topPanel().state.text?.trim();
  }
  if (t.id === 'doc') { syncDoc(); const s = document.getElementById('saved-state'); if (s) { s.textContent = 'Saving…'; clearTimeout(window._sv); window._sv = setTimeout(() => s.textContent = 'Saved', 700); } }
});
document.addEventListener('submit', (e) => { if (e.target.dataset.form === 'search') { e.preventDefault(); S.searchQ = document.getElementById('q').value; render(); } });
document.addEventListener('keydown', (e) => {
  if (e.altKey && e.shiftKey && e.code === 'KeyP') { e.preventDefault(); ACT['open-pause'](); }
  if (e.key === 'Escape' && topPanel()) closePanels();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
render();
</script>
