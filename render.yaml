# One-click deploy on Render: New + -> Blueprint -> pick this repository.
# Creates a free PostgreSQL database and the Re-Focus AI web service, and wires them together.
databases:
  - name: refocus-db
    plan: free
    databaseName: refocus
    user: refocus

services:
  - type: web
    name: refocus-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: refocus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
